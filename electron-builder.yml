# Stable installer identity: changing this after release breaks upgrade detection.
appId: io.github.nicegal.nicegal
productName: nicegal
directories:
  buildResources: build
files:
  # Allowlist, not a blocklist: the repo root has a lot of dev-only content (docs, testdata,
  # the nicegal-server Rust workspace with its multi-GB target/ and .venv-*/ dirs, scratch scripts)
  # that a growing list of "!exclude" patterns would keep missing. Only these belong in the app;
  # nicegal-server's compiled binaries ship separately through platform extraResources.
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  # GitHub artifact provenance is separate from Windows Authenticode signing.
  signExecutable: false
  executableName: nicegal
  artifactName: ${name}-${version}-windows-${arch}.${ext}
  target:
    - nsis
    - zip
    - portable
  # Updater's public download address, not a trigger for builds or uploads.
  # Builds use --publish never; only the public repository's CI uploads release assets.
  publish:
    provider: github
    owner: centuryofimage
    repo: nicegal
    releaseType: prerelease
  extraResources:
    - from: LICENSE
      to: licenses/LICENSE
    - from: LICENSING
      to: licenses/LICENSING
    - from: nicegal-server/LICENSE
      to: licenses/nicegal-server/LICENSE
    - from: nicegal-server/vendor/fastembed/LICENSE
      to: licenses/nicegal-server/vendor/fastembed/LICENSE
    - from: nicegal-server/target/release
      to: nicegal-server
      filter:
        - nicegal-server.exe
        - "*.dll"
        - onnxruntime/**/*.dll
portable:
  artifactName: ${name}-${version}-windows-${arch}-portable.${ext}
  unpackDirName: nicegal

nsis:
  include: build/installer.nsh
  artifactName: ${name}-${version}-windows-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-macos-${arch}.${ext}
linux:
  publish:
    provider: github
    owner: centuryofimage
    repo: nicegal
    releaseType: prerelease
  # Electron derives its Linux app_id/WM_CLASS from package.json's desktopName.
  # Keep the installed .desktop basename synchronized so desktop shells associate windows correctly.
  syncDesktopName: true
  target:
    - AppImage
    - deb
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  maintainer: nicegal
  category: Utility
  desktop:
    entry:
      GenericName: Image Gallery
      Keywords: gallery;images;photos;search;OCR;
      StartupNotify: "true"
  extraResources:
    - from: LICENSE
      to: licenses/LICENSE
    - from: LICENSING
      to: licenses/LICENSING
    - from: nicegal-server/LICENSE
      to: licenses/nicegal-server/LICENSE
    - from: nicegal-server/vendor/fastembed/LICENSE
      to: licenses/nicegal-server/vendor/fastembed/LICENSE
    - from: nicegal-server/target/release
      to: nicegal-server
      filter:
        - nicegal-server
        - onnxruntime/openvino/*.so*
        - onnxruntime/webgpu/*.so*
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
deb:
  # Ubuntu 24.04 is the build baseline. Include the Rust backend's OpenSSL dependency
  # as well as Electron's desktop runtime dependencies.
  depends:
    - libc6 (>= 2.39)
    - libstdc++6
    - libgcc-s1
    - libssl3t64
    - libasound2t64
    - libgbm1
    - libvulkan1
    - libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
npmRebuild: false
