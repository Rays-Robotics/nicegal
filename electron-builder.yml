appId: io.github.nicegal.nicegal
productName: nicegal
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
win:
  executableName: nicegal
  artifactName: ${name}-${version}-windows-${arch}.${ext}
  target:
    - nsis
    - zip
    - portable
  publish:
    provider: github
    owner: centuryofimage
    repo: nicegal
    releaseType: prerelease
  extraResources:
    - from: LICENSE
      to: licenses/LICENSE
    - from: LICENSING
      to: licenses/LICENSING
    - from: nicegal-server/LICENSE
      to: licenses/nicegal-server/LICENSE
    - from: nicegal-server/vendor/fastembed/LICENSE
      to: licenses/nicegal-server/vendor/fastembed/LICENSE
    - from: nicegal-server/target/release
      to: nicegal-server
      filter:
        - nicegal-server.exe
        - "*.dll"
        - onnxruntime/**/*.dll
  sign: false
portable:
  artifactName: ${name}-${version}-windows-${arch}-portable.${ext}
  unpackDirName: nicegal
nsis:
  include: build/installer.nsh
  artifactName: ${name}-${version}-windows-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  sign:
    entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: ${name}-${version}-macos-${arch}.${ext}
linux:
  publish:
    provider: github
    owner: centuryofimage
    repo: nicegal
    releaseType: prerelease
  target:
    - AppImage
    - deb
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  maintainer: nicegal
  category: Utility
  desktop:
    entry:
      GenericName: Image Gallery
      Keywords: gallery;images;photos;search;OCR;
      StartupNotify: "true"
  extraResources:
    - from: LICENSE
      to: licenses/LICENSE
    - from: LICENSING
      to: licenses/LICENSING
    - from: nicegal-server/LICENSE
      to: licenses/nicegal-server/LICENSE
    - from: nicegal-server/vendor/fastembed/LICENSE
      to: licenses/nicegal-server/vendor/fastembed/LICENSE
    - from: nicegal-server/target/release
      to: nicegal-server
      filter:
        - nicegal-server
        - onnxruntime/openvino/*.so*
        - onnxruntime/webgpu/*.so*
  executableArgs:
    - --ozone-platform-hint=auto
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
deb:
  depends:
    - libc6 (>= 2.39)
    - libstdc++6
    - libgcc-s1
    - libssl3t64
    - libasound2t64
    - libgbm1
    - libvulkan1
    - libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
nativeModules:
  npmRebuild: false
asar:
  unpack:
    - resources/**
