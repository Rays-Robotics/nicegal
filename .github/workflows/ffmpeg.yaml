name: Build static FFmpeg

on:
  workflow_call:
    inputs:
      os:
        description: Windows runner label, for example windows-2022.
        required: true
        type: string
      arch:
        description: Target architecture. Only x64 is implemented.
        required: false
        default: x64
        type: string
      config-path:
        description: Repository-relative file with one FFmpeg configure option per line.
        required: true
        type: string
    outputs:
      artifact-name:
        description: Name to pass to actions/download-artifact in a dependent job.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Validate Windows build inputs
        shell: pwsh
        env:
          FFMPEG_ARCH: ${{ inputs.arch }}
          FFMPEG_CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw 'This workflow currently supports Windows only.' }
          if ($env:FFMPEG_ARCH -ne 'x64') { throw 'This workflow currently supports x64 only.' }
          if (-not (Test-Path -LiteralPath 'C:\msys64\usr\bin\bash.exe' -PathType Leaf)) {
            throw 'The Windows runner needs MSYS2 at C:\msys64.'
          }

      - name: Checkout caller repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check configure file
        shell: pwsh
        env:
          FFMPEG_CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:FFMPEG_CONFIG_PATH -PathType Leaf)) {
            throw "FFmpeg configure file does not exist: $env:FFMPEG_CONFIG_PATH"
          }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Identify compiler and artifact
        id: artifact
        shell: pwsh
        env:
          FFMPEG_ARCH: ${{ inputs.arch }}
        run: |
          if (-not $env:VCToolsVersion) { throw 'MSVC developer environment is unavailable.' }
          "toolset=$env:VCToolsVersion" >> $env:GITHUB_OUTPUT
          "name=ffmpeg-n9.0.1-windows-$env:FFMPEG_ARCH" >> $env:GITHUB_OUTPUT

      # Cache the installed static package here so a hit skips both source checkout
      # and compilation. The artifact is still uploaded for the caller's next job.
      - name: Restore FFmpeg package
        id: package-cache
        uses: actions/cache@v6
        with:
          path: ffmpeg-install
          key: ffmpeg-n9.0.1-${{ inputs.os }}-${{ inputs.arch }}-msvc-${{ steps.artifact.outputs.toolset }}-${{ hashFiles(inputs.config-path, '.github/ffmpeg/nasm-windows.patch') }}-v1

      - name: Checkout FFmpeg 9.0.1 source
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: FFmpeg/FFmpeg
          ref: n9.0.1
          path: ffmpeg-src
          persist-credentials: false

      - name: Install MSYS2 build tools
        if: steps.package-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\pacman.exe' -S --needed --noconfirm make nasm
          if ($LASTEXITCODE -ne 0) { throw "pacman failed with exit code $LASTEXITCODE" }

      # FFmpeg 9.0.1 can produce empty NASM objects for disabled codecs. This
      # narrow patch is also used by the local vcpkg build.
      - name: Apply FFmpeg 9.0.1 Windows NASM fix
        if: steps.package-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git -C ffmpeg-src apply --check ../.github/ffmpeg/nasm-windows.patch
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg patch does not apply.' }
          git -C ffmpeg-src apply ../.github/ffmpeg/nasm-windows.patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply FFmpeg patch.' }

      - name: Configure, build, and install static FFmpeg
        if: steps.package-cache.outputs.cache-hit != 'true'
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        env:
          FFMPEG_CONFIG_PATH: ${{ inputs.config-path }}
          MSYS2_PATH_TYPE: inherit
        run: |
          repo_root="$PWD"
          config_file="$repo_root/$FFMPEG_CONFIG_PATH"
          install_root="$repo_root/ffmpeg-install"
          build_root="$repo_root/ffmpeg-build"
          vs_bin="$(cygpath -u "$VCToolsInstallDir")/bin/Hostx64/x64"
          export PATH="$vs_bin:/usr/bin:$PATH"

          options=()
          while IFS= read -r option || [[ -n "$option" ]]; do
            option="${option%$'\r'}"
            [[ -z "${option//[[:space:]]/}" || "$option" == \#* ]] && continue
            options+=("$option")
          done < "$config_file"

          mkdir -p "$build_root" "$install_root"
          cd "$build_root"
          "$repo_root/ffmpeg-src/configure" \
            --prefix="$install_root" \
            --cc=cl.exe --host-cc=cl.exe --ld=link.exe --ar=lib.exe \
            "${options[@]}"
          make -j "$(nproc)"
          make install

          mkdir -p "$install_root/share/licenses/ffmpeg"
          cp "$repo_root/ffmpeg-src/COPYING.LGPLv2.1" "$install_root/share/licenses/ffmpeg/"
          cp ffbuild/config.mak "$install_root/ffmpeg-config.mak"

      - name: Verify static package
        shell: pwsh
        run: |
          foreach ($library in @('avutil', 'avcodec', 'avformat', 'swscale')) {
            $path = Join-Path 'ffmpeg-install/lib' "$library.lib"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Missing or empty FFmpeg static library: $path"
            }
          }
          if (-not (Test-Path -LiteralPath 'ffmpeg-install/include/libavcodec/avcodec.h' -PathType Leaf)) {
            throw 'FFmpeg headers are missing from the package.'
          }

      - name: Upload FFmpeg package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ffmpeg-install/
          if-no-files-found: error
          retention-days: 1
