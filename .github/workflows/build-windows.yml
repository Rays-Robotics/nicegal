name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          token: ${{ secrets.NICEGAL_PAT || github.token }}
          persist-credentials: false
          # Release numbering reads existing tags, which a shallow clone would not have.
          fetch-depth: 0

      # package.json carries 0.0.0 as a placeholder; the shipped version comes from the tags, so a
      # release needs no version-bump commit. One release per push, however many commits it holds.
      - name: Choose the release version
        id: version
        shell: bash
        run: |
          latest=$(git tag -l 'v0.0.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            version=0.0.1
          else
            version="0.0.$(( ${latest#v0.0.} + 1 ))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version (previous tag: ${latest:-none})"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # Builds the nicegal-server Rust workspace, which lives in the nicegal-server/ submodule rather than
      # at the repo root, so the cache needs to be pointed there explicitly.
      - name: Locate libclang
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles/LLVM/bin",
            "$env:VCINSTALLDIR/Tools/Llvm/x64/bin"
          )
          $clangDirectory = $candidates | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ 'libclang.dll')
          } | Select-Object -First 1
          if (-not $clangDirectory) { throw 'The runner has no libclang.dll for Rust bindgen.' }
          "LIBCLANG_PATH=$clangDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate Visual C++ runtime
        shell: pwsh
        run: |
          $runtimeDirectory = Get-ChildItem -LiteralPath (Join-Path $env:VCToolsRedistDir 'x64') -Directory |
            Where-Object {
              $_.Name -like 'Microsoft.VC*.CRT' -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'vcruntime140.dll')) -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'msvcp140.dll'))
            } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $runtimeDirectory) { throw 'The runner has no x64 Visual C++ redistributable directory.' }
          "NICEGAL_CRT_LIB_PATH=$($runtimeDirectory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-pc-windows-msvc
          rust-src-dir: nicegal-server

      # build-server.cmd (below) needs uv to build the .venv-directml runtime that provides the
      # DirectML-enabled onnxruntime.dll.
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          cache: true

      # Bundles the server, provider libraries, and Visual C++ runtime DLLs.
      - name: Build nicegal-server (DirectML and OpenVINO)
        run: pnpm run build:backend:win

      # Written into package.json rather than committed: electron-builder reads the version from
      # there, and it is what lands in every artifact name.
      - name: Stamp the version
        run: npm pkg set version=${{ steps.version.outputs.version }}

      # The release below owns uploading; there is no auto-updater yet.
      - name: Build and package the app
        run: |
          pnpm run build
          pnpm exec electron-builder --win --publish never

      - name: Attest Windows downloads
        if: github.repository == 'nicegal/nicegal' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Preserve the attestation bundle
        if: github.repository == 'nicegal/nicegal' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: pwsh
        run: Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination dist/provenance.intoto.jsonl

      - name: Tag and publish the release
        if: github.repository == 'nicegal/nicegal' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "nicegal $version" \
            --prerelease \
            --notes-file CHANGELOG \
            dist/*.exe dist/*.zip dist/*.intoto.jsonl
