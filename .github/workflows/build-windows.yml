name: Build desktop apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  version:
    if: github.repository == 'centuryofimage/nicegal'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.NICEGAL_PAT || github.token }}
          persist-credentials: false
          # Release numbering reads existing tags, which a shallow clone would not have.
          fetch-depth: 0

      # package.json carries 0.0.0 as a placeholder; the shipped version comes from the tags, so a
      # release needs no version-bump commit. One release per push, however many commits it holds.
      - name: Choose the release version
        id: version
        shell: bash
        run: |
          latest=$(git tag -l 'v0.0.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            version=0.0.1
          else
            version="0.0.$(( ${latest#v0.0.} + 1 ))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version (previous tag: ${latest:-none})"

  build:
    if: github.repository == 'centuryofimage/nicegal'
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: win
          - os: ubuntu-24.04
            platform: linux
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.NICEGAL_PAT || github.token }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev cmake nasm libvulkan1

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Builds the nicegal-server Rust workspace, which lives in the nicegal-server/ submodule rather than
      # at the repo root, so the cache needs to be pointed there explicitly.
      - name: Locate libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles/LLVM/bin",
            "$env:VCINSTALLDIR/Tools/Llvm/x64/bin"
          )
          $clangDirectory = $candidates | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ 'libclang.dll')
          } | Select-Object -First 1
          if (-not $clangDirectory) { throw 'The runner has no libclang.dll for Rust bindgen.' }
          "LIBCLANG_PATH=$clangDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeDirectory = Get-ChildItem -LiteralPath (Join-Path $env:VCToolsRedistDir 'x64') -Directory |
            Where-Object {
              $_.Name -like 'Microsoft.VC*.CRT' -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'vcruntime140.dll')) -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'msvcp140.dll'))
            } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $runtimeDirectory) { throw 'The runner has no x64 Visual C++ redistributable directory.' }
          "NICEGAL_CRT_LIB_PATH=$($runtimeDirectory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: nicegal-server

      # build-server.cmd (below) needs uv to build the .venv-directml runtime that provides the
      # DirectML-enabled onnxruntime.dll.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/setup@v2.1.0
        with:
          version: 11.24.0
          cache: true

      # Bundles the server, provider libraries, and Visual C++ runtime DLLs.
      - name: Build nicegal-server (DirectML and OpenVINO)
        if: runner.os == 'Windows'
        run: pnpm run build:backend:win

      - name: Build nicegal-server (WebGPU and CPU)
        if: runner.os == 'Linux'
        env:
          NICEGAL_LINUX_PROVIDERS: webgpu
        run: pnpm run build:backend

      # Written into package.json rather than committed: electron-builder reads the version from
      # there, and it is what lands in every artifact name.
      - name: Stamp the version
        run: npm pkg set version=${{ needs.version.outputs.version }}

      # Generate update metadata without uploading. The release job owns all assets so clients
      # cannot discover a version before both platform builds and attestations are complete.
      - name: Build and package the app
        run: |
          pnpm run build
          pnpm exec electron-builder --${{ matrix.target }} --x64 --publish never

      - name: Verify Windows installer and update artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = 'dist/nicegal-${{ needs.version.outputs.version }}-windows-x64'
          $expected = @(
            "$prefix-setup.exe", "$prefix-setup.exe.blockmap",
            "$prefix.zip", "$prefix-portable.exe", 'dist/latest.yml',
            'dist/win-unpacked/resources/app-update.yml',
            'dist/win-unpacked/resources/nicegal-server/nicegal-server.exe'
          )
          foreach ($artifact in $expected) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf) -or
                (Get-Item -LiteralPath $artifact).Length -eq 0) {
              throw "Missing or empty Windows release artifact: $artifact"
            }
          }

      - name: Verify Linux update artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # electron-builder uses the platform's architecture names in Linux artifact filenames.
          for artifact in \
            dist/latest-linux.yml \
            dist/linux-unpacked/resources/app-update.yml \
            'dist/nicegal-${{ needs.version.outputs.version }}-linux-x86_64.AppImage' \
            'dist/nicegal-${{ needs.version.outputs.version }}-linux-amd64.deb'; do
            if [ ! -s "$artifact" ]; then
              echo "Missing or empty Linux release artifact: $artifact" >&2
              exit 1
            fi
          done

      - name: Attest downloads
        if: github.repository == 'centuryofimage/nicegal' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-linux.yml
            dist/*.AppImage
            dist/*.deb

      - name: Preserve the attestation bundle
        if: github.repository == 'centuryofimage/nicegal' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: cp "$BUNDLE_PATH" "dist/provenance-${{ matrix.platform }}.intoto.jsonl"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-linux.yml
            dist/*.AppImage
            dist/*.deb
            dist/*.intoto.jsonl

  publish:
    needs: [version, build]
    if: github.repository == 'centuryofimage/nicegal' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Tag and publish the release
        if: github.repository == 'centuryofimage/nicegal' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "nicegal $version" \
            --latest \
            --notes-file CHANGELOG \
            dist/*.exe dist/*.zip dist/*.blockmap dist/latest.yml \
            dist/*.AppImage dist/*.deb dist/latest-linux.yml dist/*.intoto.jsonl
